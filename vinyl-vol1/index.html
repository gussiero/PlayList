<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Drive — Vol. 1</title>
    
    <!-- Open Graph: чтобы ссылка красиво выглядела в Telegram/WhatsApp -->
    <meta property="og:title" content="Midnight Drive — Vol. 1">
    <meta property="og:description" content="Ночной синтвейв для пустых трасс. Темп: 110 BPM.">
    <!-- Замените ссылку ниже на реальную ссылку на вашу обложку, когда загрузите её -->
    <meta property="og:image" content="https://via.placeholder.com/600x600/1a1a1a/ffffff?text=Cover+Art">
    <meta property="og:type" content="website">

    <style>
        /* Базовые стили для тёмной темы */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        /* Стиль обложки */
        .cover-art {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background-color: #2a2a2a;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
            object-fit: cover;
            /* Временная заглушка, пока нет реальной картинки */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 1.2rem;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            color: #b0b0b0;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        /* Кнопки */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        .btn {
            display: block;
            padding: 16px;
            background-color: #ffffff;
            color: #121212;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
            background-color: #f0f0f0;
        }

        .btn.yandex {
            background-color: #FFCC00;
            color: #000000;
        }
        
        .btn.yandex:hover {
            background-color: #ffd633;
        }

        .footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Сюда потом вставишь тег <img src="cover.jpg" class="cover-art" alt="Обложка"> -->
        <div class="cover-art">
            [Здесь будет твоя обложка 1:1]
        </div>

        <h1>Midnight Drive</h1>
        <div class="subtitle">Vol. 01 • 2026</div>
        
        <p class="description">
            Ночной синтвейв для пустых трасс. <br>
            Темп: 110 BPM. Настроение: меланхолия и неон.
        </p>

        <div class="links">
            <!-- Замени # на реальные ссылки на плейлисты -->
            <a href="#" class="btn yandex">Слушать в Яндекс Музыке</a>
            <a href="#" class="btn">Слушать в Spotify</a>
        </div>

        <div class="footer">
            Отсканируй QR-код на физическом конверте, чтобы открыть эту страницу.
        </div>
    </div>

</body>
</html>

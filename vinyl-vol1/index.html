<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый плейлист — Vol. 1</title>
    
    <!-- Open Graph: чтобы ссылка красиво выглядела в Telegram/WhatsApp -->
    <meta property="og:title" content="Тестовый плейлист — Vol. 1">
    <meta property="og:description" content="Ночной синтвейв для пустых трасс. Темп: 110 BPM.">
    <meta property="og:image" content="https://via.placeholder.com/600x600/1a1a1a/ffffff?text=Cover+Art">
    <meta property="og:type" content="website">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .cover-art {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background-color: #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 1.2rem;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            color: #b0b0b0;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        .btn {
            display: block;
            padding: 16px;
            background-color: #ffffff;
            color: #121212;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            transform: scale(1.03);
        }

        .btn.yandex {
            background-color: #FFCC00;
            color: #000000;
        }
        
        .btn.yandex:hover {
            background-color: #ffd633;
        }

        .btn.vk {
            background-color: #0077FF;
            color: #ffffff;
        }

        .btn.vk:hover {
            background-color: #0066CC;
        }

        .footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="cover-art">
            [Здесь будет твоя обложка 1:1]
        </div>

        <h1>Midnight Drive</h1>
        <div class="subtitle">Vol. 01 • 2026</div>
        
        <p class="description">
            Тестовый запуск. <br>
            Скоро здесь будет настоящая обложка и QR-код.
        </p>

        <div class="links">
            <!-- Твоя ссылка на Яндекс Музыку -->
            <a href="https://music.yandex.ru/playlists/ee6750f8-77b8-6734-90ce-8e0c687529aa?utm_medium=copy_link&ref_id=554c79b8-32d0-41ca-8d1d-385750a21c39" class="btn yandex" target="_blank">Слушать в Яндекс Музыке</a>
            
            <!-- Твоя ссылка на VK Музыку -->
            <a href="https://vk.ru/audio?z=audio_playlist204833129_63/f5a6d3ec424db69216" class="btn vk" target="_blank">Слушать в VK Музыке</a>
        </div>

        <div class="footer">
            Отсканируй QR-код на физическом конверте, чтобы открыть эту страницу.
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест плейлист</title>
    
    <!-- Open Graph для красивой ссылки -->
    <meta property="og:title" content="Тест плейлист">
    <meta property="og:description" content="Какое-то описание плейлиста">
    <meta property="og:image" content="https://via.placeholder.com/600x600/1a1a1a/ffffff?text=Cover+Art">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Основной контент */
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            gap: 80px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Левая часть с текстом */
        .content {
            flex: 1;
            max-width: 500px;
        }

        .label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #aaa;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .description {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Кнопки — единый нейтральный стиль */
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: #fff;
            color: #000;
            transform: scale(1.03);
        }

        /* Социальные иконки */
        .social {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #222;
        }

        .social a {
            color: #666;
            text-decoration: none;
            font-size: 1.3rem;
            transition: color 0.2s;
        }

        .social a:hover {
            color: #fff;
        }

        /* Правая часть с обложкой */
        .cover-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .cover {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 4px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
        }

        /* Эффект свечения для обложки */
        .cover::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.3) 0%, transparent 70%);
            animation: glow 8s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* Адаптивность для мобильных */
        @media (max-width: 968px) {
            .container {
                flex-direction: column-reverse;
                gap: 40px;
                padding: 20px;
            }

            .content {
                text-align: center;
                max-width: 100%;
                width: 100%;
            }

            .cover-wrapper {
                width: 100%;
                margin-bottom: 20px;
            }

            .cover {
                max-width: 400px;
                width: 90%;
            }

            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .description {
                font-size: 1rem;
            }

            .social {
                justify-content: center;
            }

            .buttons {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .btn {
                width: 100%;
            }
        }

        /* Для очень маленьких экранов */
        @media (max-width: 480px) {
            .cover {
                max-width: 300px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Основной контент -->
    <div class="container">
        <!-- Левая часть -->
        <div class="content">
            <div class="label">Put on the playlist</div>
            <h1>Название плейлиста</h1>
            <div class="subtitle">Vol. 01 • 2026</div>
            
            <p class="description">
                Какое-то описание плейлиста <br>
                А тут вторая строчка
            </p>

            <div class="buttons">
                <!-- Яндекс Музыка -->
                <a href="https://music.yandex.ru/playlists/ee6750f8-77b8-6734-90ce-8e0c687529aa" 
                   class="btn" 
                   data-deeplink="yandexmusic://playlist/ee6750f8-77b8-6734-90ce-8e0c687529aa"
                   onclick="openApp(event, this)">
                    Listen on Yandex
                </a>
                
                <!-- VK Музыка -->
                <a href="https://vk.ru/audio?z=audio_playlist204833129_63/f5a6d3ec424db69216" 
                   class="btn" 
                   data-deeplink="vk://vk.com/audio?z=audio_playlist204833129_63/f5a6d3ec424db69216"
                   onclick="openApp(event, this)">
                    VK Music
                </a>
                
                <!-- Spotify (пример) -->
                <!-- <a href="https://open.spotify.com/playlist/..." 
                       class="btn" 
                       data-deeplink="spotify://playlist/..."
                       onclick="openApp(event, this)">
                    Spotify
                </a> -->
            </div>

            <div class="social">
                <a href="https://t.me/xAnsero" target="_blank" title="Мой Telegram">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                    </svg>
                </a>
            </div>
        </div>

        <!-- Правая часть с обложкой -->
        <div class="cover-wrapper">
            <div class="cover">
                <img src="https://via.placeholder.com/600x600/1e3c72/ffffff?text=Your+Cover+Art" alt="Cover Art">
            </div>
        </div>
    </div>

    <script>
        // Функция для открытия приложения с fallback на браузер
        function openApp(event, element) {
            event.preventDefault();
            
            const deeplink = element.getAttribute('data-deeplink');
            const webLink = element.getAttribute('href');
            
            if (deeplink) {
                // Пытаемся открыть приложение
                window.location.href = deeplink;
                
                // Если через 1.5 секунды страница не ушла в приложение, открываем веб-версию
                setTimeout(() => {
                    window.open(webLink, '_blank');
                }, 1500);
            } else {
                // Если deeplink не указан, просто открываем веб-версию
                window.open(webLink, '_blank');
            }
        }
    </script>

</body>
</html>
